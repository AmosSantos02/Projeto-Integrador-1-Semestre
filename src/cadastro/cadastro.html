<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSight Login</title>
    <link rel="stylesheet" href="/src/cadastro/cadastro.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <div class="logo">
            <h1>FinSight</h1>
            <p>organization of transactions</p>
        </div>

        <div class="login-box">
            <h2>Cadastro</h2>
            <p>Preencha os campos abaixo para sua conta ser criada</p>
            <br>

            <div class="campos_cadastro">
                <p>Digite seu nome:</p>
                <input type="text" placeholder="Ex: Gustavo da Silva">

                <p>Data de nascimento:</p>
                <input type="date" id="dataNascimento" name="dataNascimento" required>

                <p>CPF:</p>
                <input type="text" id="cpf" name="cpf" placeholder="CPF" maxlength="14" required>

                <p>Digite sua senha:</p>
                <input type="password" placeholder="Senha">

                <p>Confirme a senha digitada:</p>
                <input type="password" placeholder="Confirme a Senha">
            </div>

            <button class="cadastro" id="btnCadastro">Cadastre-se</button>
            <p id="mensagem">
                Cadastro feito! Clique novamente para continuar.
            </p>

        </div>
    </div>

    <script>
        let clicou = false;

        const botao = document.getElementById("btnCadastro");
        const mensagem = document.getElementById("mensagem");

        botao.addEventListener("click", function () {
            if (!clicou) {
                mensagem.style.display = "block";
                clicou = true;
            } else {
                window.location.href = "entrar.html";
            }
        });
    </script>

</body>

</html>
